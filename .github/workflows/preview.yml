name: Preview

# Every commit and pull request is packed and uploaded to pkg.pr.new, not npm,
# so it can be installed by commit before it is released. Requires the
# pkg-pr-new GitHub App on the repository.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # One call for all packages, so references between them point at the
      # same commit's previews instead of the versions on npm.
      - name: Publish previews
        run: bun run pkg-pr-new publish --commentWithSha './packages/*'
